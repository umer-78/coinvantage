name: Evaluate

# Re-measures the AI trader on fresh Binance candles. Start it from the Actions
# tab (Run workflow) and pick which evaluation to run. The report is in the job
# log and in the uploaded artifact; nothing is committed.
on:
  workflow_dispatch:
    inputs:
      job:
        description: Which evaluation to run
        type: choice
        options: [selection, trader-rules, trader-folds, engine, bands, external, momentum, all]
        default: selection
  # Once a month the main tests re-run on fresh candles, so the figures the app
  # publishes can be checked against the latest data (each job's summary shows
  # its result; nothing is changed in the app automatically).
  schedule:
    - cron: '17 4 1 * *'

permissions:
  contents: read

jobs:
  trader-rules:
    if: inputs.job == 'trader-rules' || inputs.job == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download candles
        run: node tools/fetch-klines.mjs klines.json

      - name: Pick the trader's rules on older data, test them on newer data
        run: node tools/evaluate-trader-rules.mjs klines.json | tee trader-rules.txt

      - name: Summary
        if: always()
        run: |
          { echo '### Trader rules'; echo '```'; grep -v '^JSON' trader-rules.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: evaluation
          path: trader-rules.txt

  selection:
    if: inputs.job == 'selection' || inputs.job == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 24 large coins that have traded on Binance for years. Coins picked today
      # are the ones that survived, which flatters any backtest that holds them.
      - name: Download candles
        env:
          COINS: BTC,ETH,BNB,SOL,XRP,DOGE,ADA,AVAX,LINK,LTC,TRX,DOT,BCH,ETC,XLM,ATOM,FIL,UNI,AAVE,NEAR,ALGO,HBAR,INJ,SAND
          PLAN: '{"1h":4000,"4h":3500,"1d":2200}'
        run: node tools/fetch-klines.mjs klines.json

      - name: Choose what to trade on older data, test it on newer data
        run: node tools/evaluate-selection.mjs klines.json | tee selection.txt

      - name: Summary
        if: always()
        run: |
          { echo '### Coin selection'; echo '```'; grep -v '^JSON' selection.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: selection
          path: selection.txt

  trader-folds:
    if: github.event_name == 'schedule' || inputs.job == 'trader-folds' || inputs.job == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download candles
        env:
          COINS: BTC,ETH,BNB,SOL,XRP,DOGE,ADA,AVAX,LINK,LTC,TRX,DOT,BCH,ETC,XLM,ATOM,FIL,UNI,AAVE,NEAR,ALGO,HBAR,INJ,SAND
          PLAN: '{"15m":4000,"1h":4000,"4h":3500,"1d":2200}'
        run: node tools/fetch-klines.mjs klines.json

      - name: Each chart's own rules against the app's, walk-forward
        run: node tools/evaluate-trader-folds.mjs klines.json | tee trader-folds.txt

      - name: Summary
        if: always()
        run: |
          { echo '### AI trader, walk-forward by chart'; echo '```'; grep -v '^JSON' trader-folds.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: trader-folds
          path: trader-folds.txt

  # Do the price ranges hold as often as they say? 24 coins, five charts, every
  # non-overlapping horizon; a width factor is fitted on the older half of each
  # series and kept only if it helps on the newer half.
  bands:
    if: github.event_name == 'schedule' || inputs.job == 'bands' || inputs.job == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download candles
        env:
          COINS: BTC,ETH,BNB,SOL,XRP,DOGE,ADA,AVAX,LINK,LTC,TRX,DOT,BCH,ETC,XLM,ATOM,FIL,UNI,AAVE,NEAR,ALGO,HBAR,INJ,SAND
          # 5m and 15m go back ~100 days so their verdict is not decided by one week
          PLAN: '{"5m":30000,"15m":12000,"1h":4000,"4h":3500,"1d":2200}'
        run: node tools/fetch-klines.mjs klines.json

      - name: Range calibration, fitted on older candles and checked on newer ones
        run: node tools/evaluate-bands.mjs klines.json | tee bands.txt

      - name: Volatility for the ranges, 100-candle against exponentially weighted
        run: node tools/evaluate-volatility.mjs klines.json | tee volatility.txt

      - name: Summary
        if: always()
        run: |
          { echo '### Price-range calibration'; echo '```'; grep -v '^JSON' bands.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          { echo '### Volatility estimate'; echo '```'; grep -v '^JSON' volatility.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: bands
          path: |
            bands.txt
            volatility.txt

  # Outside data — Fear & Greed, futures funding, taker-buy share — tested for
  # what it says about the next week, with the bar written in the script.
  external:
    if: inputs.job == 'external' || inputs.job == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COINS: BTC,ETH,BNB,SOL,XRP,DOGE,ADA,AVAX,LINK,LTC,TRX,DOT,BCH,ETC,XLM,ATOM,FIL,UNI,AAVE,NEAR,ALGO,HBAR,INJ,SAND
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download candles
        env:
          PLAN: '{"1d":2200}'
        run: node tools/fetch-klines.mjs klines.json

      - name: Download Fear & Greed and funding history
        run: node tools/fetch-external.mjs external.json

      - name: What outside data says about the next week
        run: node tools/evaluate-external.mjs klines.json external.json | tee external.txt

      - name: Summary
        if: always()
        run: |
          { echo '### Outside data'; echo '```'; grep -v '^JSON' external.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: external
          path: external.txt

  # The same weekly test for the published price factors (momentum, reversal),
  # without the outside downloads.
  momentum:
    if: github.event_name == 'schedule' || inputs.job == 'momentum' || inputs.job == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download candles
        env:
          COINS: BTC,ETH,BNB,SOL,XRP,DOGE,ADA,AVAX,LINK,LTC,TRX,DOT,BCH,ETC,XLM,ATOM,FIL,UNI,AAVE,NEAR,ALGO,HBAR,INJ,SAND
          PLAN: '{"1d":2200}'
        run: node tools/fetch-klines.mjs klines.json

      - name: Momentum and reversal, coin against coin, week by week
        run: node tools/evaluate-external.mjs klines.json none | tee momentum.txt

      - name: Summary
        if: always()
        run: |
          { echo '### Momentum and reversal across coins'; echo '```'; grep -v '^JSON' momentum.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: momentum
          path: momentum.txt

  # The forecast's release test re-run on fresh candles: 12 coins, six charts,
  # 20 forecasts per coin and chart, split over six runners.
  engine-data:
    if: github.event_name == 'schedule' || inputs.job == 'engine' || inputs.job == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download candles
        env:
          PLAN: '{"1m":4000,"5m":4000,"15m":4000,"1h":4000,"4h":3500,"1d":2200}'
        run: node tools/fetch-klines.mjs klines.json
      - uses: actions/upload-artifact@v4
        with:
          name: engine-klines
          path: klines.json

  engine:
    needs: engine-data
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: engine-klines
      - name: Forecasts made walk-forward
        run: node tools/evaluate-engine.mjs klines.json ${{ matrix.shard }} 6 out-${{ matrix.shard }}.json 20
      - uses: actions/upload-artifact@v4
        with:
          name: engine-out-${{ matrix.shard }}
          path: out-${{ matrix.shard }}.json

  engine-report:
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          pattern: engine-out-*
          merge-multiple: true
      - name: Hit rate, baseline and direction trust per chart
        run: node tools/report-engine.mjs out-*.json | tee engine.txt

      - name: Summary
        if: always()
        run: |
          { echo '### Forecast re-check on fresh candles'; echo '```'; grep -v '^JSON' engine.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: engine-report
          path: engine.txt
