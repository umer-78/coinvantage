name: Evaluate

# Re-measures the AI trader's rules on fresh Binance candles. Start it from the
# Actions tab (Run workflow). The report is in the job log and in the
# "evaluation" artifact; nothing is committed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trader-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download candles
        run: node tools/fetch-klines.mjs klines.json

      - name: Pick the trader's rules on older data, test them on newer data
        run: node tools/evaluate-trader-rules.mjs klines.json | tee trader-rules.txt

      - uses: actions/upload-artifact@v4
        with:
          name: evaluation
          path: trader-rules.txt
